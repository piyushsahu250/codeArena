name: CI

# Free (GitHub Actions is free for this repo's tier) build/validate gate that runs before
# Render/Vercel's existing auto-deploy-on-push — this doesn't replace that deploy step, it just
# catches a broken schema or build before it reaches production. Render's own `prisma db push`
# is not run here (it needs a real Postgres and mutates it); `prisma validate` catches schema
# syntax/relation errors without touching any database.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          # Dummy value — `prisma validate` only needs the env var to be present to resolve the
          # schema's env("DATABASE_URL") reference, it never opens a connection.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npx prisma generate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
