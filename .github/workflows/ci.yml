name: CI

# Free (GitHub Actions is free for this repo's tier) build/validate gate that runs before
# Render/Vercel's existing auto-deploy-on-push — this doesn't replace that deploy step, it just
# catches a broken schema or build before it reaches production. Render's own `prisma db push`
# is not run here (it needs a real Postgres and mutates it); `prisma validate` catches schema
# syntax/relation errors without touching any database.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values — schema.prisma's datasource block references both env("DATABASE_URL") and
      # env("DIRECT_DATABASE_URL") (the latter for Prisma's non-pooled connection during schema
      # operations), so both must resolve to *something* for `prisma validate`/`generate` to even
      # parse the schema — neither command opens a real connection. Set at job level so every step
      # in this job sees them, not just one.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # npm ci (not npm install) requires package-lock.json to exactly match package.json, and
      # this repo's lockfiles have drifted out of sync with their package.json (dependencies added
      # over time without a local `npm install` to regenerate the lock — this environment has no
      # local Node/npm). Render's own Dockerfile already uses `npm install` for the same reason,
      # so this matches production rather than failing on a pre-existing packaging mismatch that
      # has no actual effect on what ships.
      - run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
      - run: npx prisma generate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci (not npm install) requires package-lock.json to exactly match package.json, and
      # this repo's lockfiles have drifted out of sync with their package.json (dependencies added
      # over time without a local `npm install` to regenerate the lock — this environment has no
      # local Node/npm). Render's own Dockerfile already uses `npm install` for the same reason,
      # so this matches production rather than failing on a pre-existing packaging mismatch that
      # has no actual effect on what ships.
      - run: npm install
      - run: npm run build
