# Squid forward proxy for an isolated EXAM VLAN (free, runs on any small Linux box or VM).
# Exam PCs reach the internet ONLY through this proxy; the VLAN firewall blocks every other outbound path (see README.md).
# Only the hosts below are reachable, so Google, Bing, ChatGPT, Claude, Gemini, Perplexity, GitHub, Stack Overflow, YouTube
# and social media all fail at the network, whatever software runs on the PC.
#
# Install: apt install squid ; copy to /etc/squid/squid.conf ; systemctl restart squid
http_port 3128

acl exam_net src 10.50.0.0/24            # <- the exam VLAN subnet
acl allowed_sites dstdomain .codearena.site api-aws.codearena.site
acl allowed_sites dstdomain fonts.googleapis.com fonts.gstatic.com storage.googleapis.com tfhub.dev www.kaggle.com
acl CONNECT method CONNECT
acl safe_ports port 443 80

http_access deny !safe_ports
http_access allow exam_net allowed_sites
http_access deny all

# HTTPS is tunnelled (CONNECT) without interception; the allowlist is on the destination host name.
cache deny all
via off
forwarded_for delete
access_log /var/log/squid/exam-access.log
