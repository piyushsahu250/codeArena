# DNS allow-list for the exam VLAN (free; Unbound). Use together with the firewall rule that only lets exam PCs query THIS server.
# Names not listed resolve to NXDOMAIN, so unknown sites (including every AI service) do not resolve at all.
server:
    interface: 10.50.0.2
    access-control: 10.50.0.0/24 allow
    access-control: 0.0.0.0/0 refuse
    local-zone: "." always_nxdomain

    # allowed names: forward to the upstream resolver
    local-zone: "codearena.site." transparent
    local-zone: "api-aws.codearena.site." transparent
    local-zone: "fonts.googleapis.com." transparent
    local-zone: "fonts.gstatic.com." transparent
    local-zone: "storage.googleapis.com." transparent
    local-zone: "tfhub.dev." transparent
    local-zone: "www.kaggle.com." transparent

forward-zone:
    name: "codearena.site."
    forward-addr: 1.1.1.1
forward-zone:
    name: "api-aws.codearena.site."
    forward-addr: 1.1.1.1
forward-zone:
    name: "fonts.googleapis.com."
    forward-addr: 1.1.1.1
forward-zone:
    name: "fonts.gstatic.com."
    forward-addr: 1.1.1.1
forward-zone:
    name: "storage.googleapis.com."
    forward-addr: 1.1.1.1
forward-zone:
    name: "tfhub.dev."
    forward-addr: 1.1.1.1
forward-zone:
    name: "www.kaggle.com."
    forward-addr: 1.1.1.1
